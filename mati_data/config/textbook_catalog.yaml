# Mati 教材目录映射表（Textbook Catalog）
#
# 用途：依据教材书名判定 subject（学科）/ grade（年级）/ grade_span（适用年级区间）等元数据，
#       供 scripts/ingest_content.py 在入库时写入 ChromaDB metadata，并供检索层做学科路由与年级加权。
#
# 维护方式：新增教材时在 books 下追加一条，必须提供 id / subject / grade / match_all。
#           解析器见 system/rag/curriculum_catalog.py。
#
# ─────────────────────────────────────────────────────────────────────────────
# 年级口径（重要，不要随意改）
# ─────────────────────────────────────────────────────────────────────────────
# grade  = 官方教材选用/征订目录中标注的年级，取"最早被正常讲授的年级"
#          （这样不会因年级过滤把学生实际在学的书挡掉）
# grade_span = 兼顾各校教学进度差异的适用年级区间，检索侧做软加权时用
#
# 年级编码：10=高一 11=高二 12=高三（与 GUI 的年级选择器对齐）
#
# 已知分歧（已在各书 grade_note 中标注）：
#   · 物理必修第三册：各省市教材征订目录统一标"高一"（必修课程、合格考依据），
#     但实际教学多安排在高二上（如青岛市即墨四中、德州市实验中学、凉山州教科所进度表）。
#     → 取 grade=10（与征订口径一致），grade_span=[10,11]。
#   · 信息技术选择性必修第四册《人工智能初步》：中小学教材征订目录标"高二"，
#     电子课本网按实际教学顺序标"高三"。→ 取 grade=11，grade_span=[11,12]。
#   · 化学选择性必修3《有机化学基础》/ 语文选择性必修下册：多数学校高二完成，
#     部分学校延至高三。→ grade=11，grade_span=[11,12]。

version: 1
updated: 2026-10-01

# 需要按 discipline（细分学科）拆集合的家族学科。
# science 家族下有物理/化学/生物三个细分学科，若共用一个集合，
# 学生问「光合作用」时可能召回物理块（串科）。
# 其余学科（math / chinese / english / computer_science / social_studies）
# 一个家族只有一个细分学科，不拆，集合名沿用家族名，避免无谓的重建。
discipline_split_subjects:
  - science

grade_labels:
  "10": 高一
  "11": 高二
  "12": 高三

# subject 取值与 GUI 学科过滤器、检索层集合路由对齐
subject_labels:
  science: 物理/化学/生物
  math: 数学
  chinese: 语文
  computer_science: 信息技术
  english: 英语
  social_studies: 政治/历史/地理

sources:
  - name: 教育部办公厅 2022 年中小学教学用书目录
    url: https://jyt.ah.gov.cn/group3/M00/09/C2/wKg86mL1pXyAW_vuAjGkzSqYfOI137.pdf
    role: 确认信息技术（人教中图版）必修 1–2 与选择性必修 1–6 的册次名称与出版单位
  - name: 山东省多校教材选用/征订目录
    url: https://www.lanling.gov.cn/info/3894/1361542.htm
    role: 确认"必修→高一、选择性必修→高二"的统一口径；其中物理必修第三册标高一
  - name: 电子课本网·高中电子课本（人教中图版信息技术分册年级）
    url: http://www.dzkbw.com/books/gaozhong-all
    role: 确认信息技术选必1/2/3=高二、选必4/5/6=高三的实际教学顺序
  - name: 学校教学进度表（青岛市即墨四中 / 德州市实验中学 / 凉山州教科所）
    role: 确认物理必修第三册实际授课年级多在高二上，与征订口径存在分歧
  - name: 泸州市教育科学研究所「新高考背景下数学学科教材版本以及学习顺序」答复
    url: https://wen.lzep.cn/wen/190894.html
    role: 确认数学人教A版高一学完必修一/二、高二学完选择性必修一/二/三

