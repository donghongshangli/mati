# Mati 术语同义词表（Query 改写用）
#
# 作用：把学生口语/别名映射到教材的标准术语，用于**多路并查**而不是替换原查询
# （见 system/rag/query_rewriter.py 的设计取舍说明）。
#
# 维护约定：
#   · 每组的 terms 是「互为同义」的写法，顺序无关；组内两两互为同义。
#   · 只收「教材确实会出现的标准术语」与「学生常说的别名」，
#     不要收语义不同但字面相近的词（如「向心力」与「离心力」是不同概念，
#     放同一组会让检索串答案 —— 这类只在检索里靠关键词区分，不做同义扩展）。
#   · 术语长度 ≥ 2 个汉字，避免过度匹配。
#
# 后续：`retrieval_failures.jsonl` 里高频失败的问题，应当反哺到本表
# （scripts/run_pattern_mining 可挖掘），形成「失败 → 补同义词 → 召回提升」的闭环。

